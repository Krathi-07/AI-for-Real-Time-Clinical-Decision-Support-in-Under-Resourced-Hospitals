[project]
name = "clinical-ai-decision-support"
version = "0.1.0"
description = "Virtual junior doctor AI for under-resourced hospitals"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "numpy==1.26.4",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.0",
    "scikit-learn>=1.3.0,<1.4.0",
    "scispacy>=0.5.4",
    "shap==0.47.0",
    "spacy==3.7.5",
    "uvicorn>=0.30.0",
    "xgboost==1.7.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

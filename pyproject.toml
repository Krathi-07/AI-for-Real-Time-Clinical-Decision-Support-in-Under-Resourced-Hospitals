[project]
name = "clinical-ai-decision-support"
version = "0.1.0"
description = "Virtual junior doctor AI for under-resourced hospitals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==1.26.4",
    "scikit-learn>=1.9.0",
    "scispacy>=0.2.4",
    "spacy==3.7.5",
    "xgboost>=3.4.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "langgraph>=1.2.11",
    "flwr[simulation]>=1.32.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

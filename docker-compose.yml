# docker-compose.yml
# Start the full stack with: docker compose up --build
# Stop with: docker compose down

version: "3.9"

services:

  # ─────────────────────────────────────────────
  # Service 1: FastAPI clinical decision API
  # ─────────────────────────────────────────────
  api:
    build:
      context: .          # use the Dockerfile in the current directory
      target: runtime     # use the lean runtime stage, not the builder stage
    image: clinical-ai-api:latest
    container_name: clinical-ai-api
    ports:
      - "8000:8000"       # host_port:container_port
    environment:
      - PYTHONUNBUFFERED=1
      - FHIR_SERVER_URL=https://hapi.fhir.org/baseR4
    volumes:
      # Mount src/ so code changes reflect without rebuilding the image.
      # Remove this in production — bake the code into the image instead.
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # give scispaCy model time to load on cold start
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Service 2: Federated learning simulation
  # Runs the 3-hospital FL round and exits cleanly.
  # ─────────────────────────────────────────────
  fl-simulation:
    build:
      context: .
      target: runtime
    image: clinical-ai-api:latest   # reuses the same image — no second build
    container_name: clinical-ai-fl
    command: ["python", "-m", "src.federated.run_simulation"]
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src:ro
    depends_on:
      api:
        condition: service_healthy  # wait for API to pass healthcheck first
    restart: "no"                   # FL sim runs once and exits — don't restart it
    